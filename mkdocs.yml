site_name: Babelagent
site_description: >-
  The Babel that lets AI agents understand each other. A neutral layer where
  heterogeneous agents (callables, HTTP/OpenAPI, MCP, framework agents, LLMs)
  share one interface, collaborate (A2A), and get graded at each hop.
site_url: https://amitpatole.github.io/babelagent/
repo_url: https://github.com/amitpatole/babelagent
repo_name: amitpatole/babelagent
copyright: MIT © Amit Patole
docs_dir: docs

# The social post draft under docs/posts/ is not part of the published site.
exclude_docs: |
  posts/

theme:
  name: material
  palette:
    scheme: default          # Warm Paper — light, editorial
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - The whole story: STORY.md
  - Adapters & adapt(): adapters.md
  - Agent-to-agent (A2A & MCP): a2a.md
  - Security: SECURITY.md
  - API reference: api.md
  - Changelog: changelog.md
