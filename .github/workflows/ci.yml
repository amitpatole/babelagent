name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of sync with pyproject; the install is
      # reproducible and hash-verified from the committed lockfile.
      - name: Sync (locked, verified)
        run: >-
          uv sync --locked --python ${{ matrix.python-version }}
          --extra serve --extra mcp --extra dev
      # --no-sync: run in the already-synced env (don't re-resolve away the extras).
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Smoke (key-free demo)
        run: uv run --no-sync babelagent demo
